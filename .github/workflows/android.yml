
name: Build MIMA AI Agent APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MIMA_AI_Agent_Stage1_Starter_Kit.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o MIMA_AI_Agent_Stage1_Starter_Kit.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('extracted/MIMA_AI_Agent_Stage1/MimaAIAgentAndroid/app/build.gradle.kts')
          s = p.read_text()

          if 'sourceCompatibility = JavaVersion.VERSION_17' not in s:
              s = s.replace(
                  'android {',
                  '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          ''',
                  1
              )

          p.write_text(s)
          PY

      - name: Build Android APK
        run: gradle -p extracted/MIMA_AI_Agent_Stage1/MimaAIAgentAndroid assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MIMA-AI-Agent-APK
          path: extracted/MIMA_AI_Agent_Stage1/MimaAIAgentAndroid/app/build/outputs/apk/debug/*.apk
